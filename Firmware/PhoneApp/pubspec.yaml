name: star_companion
description: Companion app for the Star Topper ornament.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.13.0 <4.0.0" # esp_prov needs Dart 3.13+

dependencies:
  flutter:
    sdk: flutter
  esp_prov: ^0.1.1 # Espressif Unified Provisioning over BLE (pure Dart)
  http: ^1.2.0
  shared_preferences: ^2.3.0
  file_picker: ^13.3.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
